services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo}
      POSTGRES_DB: ${POSTGRES_DB:-peblo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@db:5432/peblo
    ports:
      - "8000:8000"
    volumes:
      - ./data/storage:/app/data/storage
    depends_on:
      db:
        condition: service_healthy

  cms:
    build: ./apps/cms
    ports:
      - "5173:80"
    depends_on: [api]

  viewer:
    build: ./apps/viewer
    ports:
      - "5174:80"
    depends_on: [api]

volumes:
  pgdata:
